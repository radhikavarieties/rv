<!-- components/navbar.html -->
<!-- Include via fetch + innerHTML or copy-paste into each page -->

<nav class="navbar" id="navbar">
  <div class="navbar__inner">

    <a href="index.html" class="navbar__brand">Shop<span>Mart</span></a>

    <div class="navbar__search">
      <svg class="navbar__search-icon" width="16" height="16" fill="none" stroke="#fff" stroke-width="2"
           viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="search" id="globalSearch" placeholder="Search products…" autocomplete="off">
    </div>

    <button class="navbar__hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <ul class="navbar__links">
      <li><a href="index.html"    class="navbar__link">Home</a></li>
      <li><a href="products.html" class="navbar__link">Products</a></li>

      <li>
        <a href="cart.html" class="navbar__link navbar__cart" aria-label="Cart">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
      </li>

      <!-- Guest links (shown when logged out) -->
      <li class="nav-guest">
        <a href="login.html" class="navbar__link btn btn--primary btn--sm">Log In</a>
      </li>

      <!-- User dropdown (shown when logged in) -->
      <li class="nav-auth navbar__user hidden">
        <button class="navbar__user-btn" id="userMenuBtn">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <span id="navUserName">Account</span>
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="navbar__dropdown" id="userDropdown">
          <a href="profile.html">My Profile</a>
          <a href="orders.html">My Orders</a>
          <div class="navbar__dropdown-divider"></div>
          <a href="#" id="logoutBtn">Log Out</a>
        </div>
      </li>
    </ul>

  </div>
</nav>

<script>
  // Hamburger toggle
  document.getElementById("hamburger")?.addEventListener("click", () => {
    document.getElementById("navbar").classList.toggle("open");
  });

  // User dropdown toggle
  document.getElementById("userMenuBtn")?.addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("userDropdown").classList.toggle("open");
  });
  document.addEventListener("click", () => {
    document.getElementById("userDropdown")?.classList.remove("open");
  });

  // Auth state
  (function updateNavAuth() {
    const user  = getUser();
    const token = getToken();
    document.querySelectorAll(".nav-guest").forEach(el => el.classList.toggle("hidden", !!token));
    document.querySelectorAll(".nav-auth").forEach(el  => el.classList.toggle("hidden", !token));
    if (user) document.getElementById("navUserName").textContent = user.name || "Account";
    refreshCartBadge();
  })();

  // Logout
  document.getElementById("logoutBtn")?.addEventListener("click", async (e) => {
    e.preventDefault();
    await Auth.logout();
    clearSession();
    window.location.href = "index.html";
  });

  // Global search
  document.getElementById("globalSearch")?.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.value.trim()) {
      window.location.href = `products.html?q=${encodeURIComponent(e.target.value.trim())}`;
    }
  });
</script>
